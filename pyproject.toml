[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ikkem-national-energy-model"
version = "1.0.0"
description = "Python package for the IKKEM national energy system model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "gurobipy",
  "numpy",
  "omegaconf",
  "pandas",
]

[project.scripts]
ikkem-derive-no-migration-share = "ikkem.workload.derive_no_migration_flexible_share:main"

[tool.setuptools.packages.find]
where = ["src"]
